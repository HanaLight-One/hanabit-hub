<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>오늘의 운세 · 하나빛 허브</title>
    <link rel="stylesheet" href="/fortune/styles.css" />
    <link rel="stylesheet" href="/codex-usage-indicator.css" />
  </head>
  <body>
    <header><a href="/">← 허브 홈</a><span>OWNER ONLY</span></header>
    <main>
      <p class="eyebrow">DAILY FORTUNE ARCHIVE</p>
      <h1>오늘의<br /><em>운세.</em></h1>
      <p class="intro">생성된 운세 본문과 안전한 DC 게시 상태만 읽기 전용으로 확인합니다.</p>

      <section class="toolbar">
        <label for="date-select">날짜 선택</label>
        <select id="date-select" disabled><option>불러오는 중</option></select>
        <a id="download-link" class="download disabled" aria-disabled="true">TXT 다운로드</a>
      </section>

      <section class="publication" aria-labelledby="publication-title">
        <div><p class="label">PUBLICATION STATUS</p><h2 id="publication-title">DC 게시 상태</h2></div>
        <div class="publication-value"><span id="publication-dot"></span><strong id="publication-status">확인 중</strong><small id="publication-time"></small></div>
        <a id="publication-link" class="post-link" hidden target="_blank" rel="noopener noreferrer">게시글 열기 ↗</a>
      </section>

      <p id="notice" class="notice" role="status" aria-live="polite">운세를 불러오고 있어요.</p>
      <pre id="fortune-text" hidden></pre>
    </main>
    <script type="module" src="/codex-usage-indicator.js"></script>
    <script type="module" src="/fortune/app.js"></script>
  </body>
</html>
