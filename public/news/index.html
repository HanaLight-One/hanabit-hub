<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>뉴스 대기함 · 하나빛 허브</title>
    <link rel="stylesheet" href="/news/styles.css" />
  </head>
  <body>
    <header>
      <a href="/">← 허브 홈</a>
      <span>OWNER ONLY</span>
    </header>
    <main>
      <p class="eyebrow">HANABIT NEWS LAB</p>
      <h1>뉴스<br /><em>대기함.</em></h1>
      <p class="intro">수집된 원문과 이미지, 번역·판정 진행 상태를 읽기 전용으로 확인합니다.</p>

      <section class="summary" aria-label="뉴스 현황">
        <div><strong id="total-count">—</strong><span>전체 대기</span></div>
        <div><strong id="translation-count">—</strong><span>번역 대기</span></div>
        <div><strong id="media-count">—</strong><span>보존 이미지</span></div>
      </section>

      <p id="notice" class="notice" role="status" aria-live="polite">대기함을 확인하고 있어요.</p>
      <section id="news-list" class="news-list" aria-label="수집된 뉴스"></section>
    </main>
    <script type="module" src="/news/app.js"></script>
  </body>
</html>
