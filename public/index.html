<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090c10" />
    <meta name="description" content="하나빛의 작은 도구와 자동화를 관리하는 Owner Only 허브" />
    <title>Hanabit Hub</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <main>
      <p class="eyebrow">OWNER ONLY · LOCAL FOUNDATION</p>
      <h1>하나빛 허브의<br /><em>첫 번째 빛.</em></h1>
      <p class="intro">
        작게 시작하고, 안전하게 연결하고, 필요할 때 확장합니다.
        기존 Image Studio와 자동화는 아직 그대로 운영 중이에요.
      </p>

      <section class="status-card" aria-labelledby="server-title">
        <div>
          <p class="label">FOUNDATION STATUS</p>
          <h2 id="server-title">새 허브 개발 서버</h2>
        </div>
        <p id="server-status" class="status" aria-live="polite">
          <span></span> 확인 중
        </p>
      </section>

      <section class="modules" aria-label="예정된 허브 모듈">
        <a class="module-link" href="/images">
          <span>01</span><h2>이미지</h2><p>새 허브의 읽기 전용 이미지 아카이브</p>
        </a>
        <article><span>02</span><h2>운세</h2><p>읽기 전용 콘텐츠와 게시 상태</p></article>
        <article><span>03</span><h2>자동화</h2><p>허용된 상태만 한눈에 확인</p></article>
      </section>
    </main>
  </body>
</html>
